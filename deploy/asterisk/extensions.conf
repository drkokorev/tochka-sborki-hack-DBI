; Диалплан ассистента. Регистрация на SIP-шлюзе хакатона — /opt/hackathon/sip/pjsip.conf (копирует setup_asterisk.sh).
[general]
static=yes
writeprotect=yes

[globals]
; Куда переводить звонок с карточкой: пост регистратуры (в эксплуатации — очередь регистраторов, например
; PJSIP/registry или Local/s@registry-queue с Queue()). В демо свободного регистратора нет: гудки, затем
; обещание перезвонить — обращение с карточкой уже в МИС (заявка на перевод)
OPERATOR=Local/s@registry-demo

; Входящий звонок на номер команды → ассистент по AudioSocket (apps/telephony.py, 127.0.0.1:9092).
; Ассистент работает в отдельном Local-канале: когда он отключается (AudioSocket закрыт), звонок пациента
; не обрывается, а продолжает диалплан (Dial с опцией g). Если ассистент перевёл звонок (жалоба, острая боль,
; просьба соединить), он ставит отметку transfer/<UUID> в AstDB — и звонок уходит регистратору.
; Функции UUID() в Asterisk 18 нет: UUID звонка собираем из UNIQUEID.
[from-gateway]
exten => 094,1,Set(CALLBACK=${CALLERID(num)})   ; кому перезвонить после разговора (эксперт expert-N или наш phone-094)
 same => n,Answer()
 same => n,Set(ID=000000000000${FILTER(0123456789,${UNIQUEID})})
 same => n,Set(__CALLUUID=00000000-0000-4000-8000-${ID:-12})
 same => n,Dial(Local/s@assistant/n,,g)
 same => n,GotoIf(${DB_EXISTS(transfer/${CALLUUID})}?transfer)
 same => n,Hangup()
 same => n(transfer),NoOp(${DB_DELETE(transfer/${CALLUUID})})
 same => n,Dial(${OPERATOR},60)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Playback(custom/registry-busy)          ; никто не ответил — регистратор перезвонит по заявке
 same => n(done),Hangup()

; Перезвон после разговора — только эксперту (expert-N) или на наш софтфон для самопроверки; другим не звоним
exten => h,1,GotoIf($[${REGEX("^(expert-?[0-9]+|phone-?094)$" ${CALLBACK})}]?cb:done)
 same => n(cb),Set(NUM=${FILTER(0123456789,${CALLBACK})})   ; шлюз присылает phone094/expert3, набирать надо phone-094/expert-3
 same => n,Set(PFX=${IF($["${CALLBACK:0:5}" = "phone"]?phone:expert)})
 same => n,Originate(PJSIP/${PFX}-${NUM}@gateway,exten,expert-callback,s,1,45,a)
 same => n(done),NoOp()

; Перезвон: тот же ассистент, новый разговор (свой UUID, как у входящего звонка)
[expert-callback]
exten => s,1,Answer()
 same => n,Set(ID=000000000000${FILTER(0123456789,${UNIQUEID})})
 same => n,Set(__CALLUUID=00000000-0000-4000-8000-${ID:-12})
 same => n,Dial(Local/s@assistant/n,,g)
 same => n,GotoIf(${DB_EXISTS(transfer/${CALLUUID})}?transfer)
 same => n,Hangup()
 same => n(transfer),NoOp(${DB_DELETE(transfer/${CALLUUID})})
 same => n,Dial(${OPERATOR},60)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Playback(custom/registry-busy)
 same => n(done),Hangup()

; Плечо ассистента: голос пациента ↔ AudioSocket
[assistant]
exten => s,1,Answer()
 same => n,AudioSocket(${CALLUUID},127.0.0.1:9092)
 same => n,Hangup()

; Исходящее напоминание: AMI Originate передаёт REMINDER_UUID, по нему ассистент узнаёт запись
[reminder-answered]
exten => s,1,Answer()
 same => n,Set(__CALLUUID=${REMINDER_UUID})
 same => n,Dial(Local/s@assistant/n,,g)
 same => n,GotoIf(${DB_EXISTS(transfer/${CALLUUID})}?transfer)
 same => n,Hangup()
 same => n(transfer),NoOp(${DB_DELETE(transfer/${CALLUUID})})
 same => n,Dial(${OPERATOR},60)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Playback(custom/registry-busy)
 same => n(done),Hangup()

; Демо-пост регистратуры: свободных регистраторов нет — гудки 15 с, затем обещание перезвонить
[registry-demo]
exten => s,1,Ringing()
 same => n,Wait(15)
 same => n,Hangup()

; Как ассистент встраивается в существующее голосовое меню клиники (кейс: дополняет IVR, а не заменяет):
; «1» — виртуальный помощник, «0» или тишина у пожилого пациента — регистратор. В демо номер 094 ведёт
; сразу к ассистенту, а он сам в любой момент соединяет с оператором.
[ivr-clinic]
exten => s,1,Answer()
 same => n,Background(custom/ivr-welcome)
 same => n,WaitExten(5)
exten => 1,1,Goto(from-gateway,094,1)
exten => 0,1,Dial(${OPERATOR},60)
 same => n,Playback(custom/registry-busy)
 same => n,Hangup()
exten => t,1,Goto(0,1)
exten => i,1,Goto(s,1)

; Самопроверка телефонии без софтфона: «пациент» проигрывает записанные фразы (custom/selftest-N), ассистент отвечает.
; sudo asterisk -rx "channel originate Local/094@from-gateway extension s@selftest"
[selftest]
exten => s,1,Answer()
 same => n,Wait(8)
 same => n,Playback(custom/selftest-1)
 same => n,Wait(12)
 same => n,Playback(custom/selftest-2)
 same => n,Wait(12)
 same => n,Hangup()
